<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استطلاع رأي الخدمة - استبيان العملاء</title>

  <!-- Tailwind CSS للتنسيق العصري -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Web Modular SDK v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // إعدادات Firebase الخاصة بمشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyBpn_n4f5FXtb4EvbnVGAzVDG1sviEkhCE",
      authDomain: "amrcou-67ba2.firebaseapp.com",
      databaseURL: "https://amrcou-67ba2-default-rtdb.firebaseio.com",
      projectId: "amrcou-67ba2",
      storageBucket: "amrcou-67ba2.firebasestorage.app",
      messagingSenderId: "373408181807",
      appId: "1:373408181807:web:1d5ebf8cfcedbb9aee60da",
      measurementId: "G-M7MVH8FFPH"
    };

    // تهيئة الفايربيس والقاعدة
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // استخراج بيانات التكت، الموظف، واسم العميل من رابط الواتساب
    // مثال: ?ticket=5001&agent=محمد&name=علي
    const urlParams = new URLSearchParams(window.location.search);
    const ticketId = urlParams.get('ticket') || 'غير محدد';
    const agentName = urlParams.get('agent') || 'غير محدد';
    const customerName = urlParams.get('name') || 'عميلنا العزيز';

    // عرض اسم العميل ورقم التكت في الهيدر
    document.getElementById('customerWelcome').innerText = `أهلاً بك، ${customerName}`;
    if (ticketId !== 'غير محدد') {
      document.getElementById('ticketDisplay').innerText = `رقم الطلب / التكت: #${ticketId}`;
    }

    // دالة حفظ التقييم
    window.submitFeedback = async function () {
      const rating = document.querySelector('input[name="rating"]:checked')?.value;
      const mainIssue = document.getElementById('mainIssue').value;
      const suggestion = document.getElementById('suggestion').value.trim();

      if (!rating) {
        alert("لطفاً، اختر التقييم بالنجوم أولاً ⭐️");
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "جاري الإرسال...";

      try {
        const feedbackRef = ref(db, 'feedbacks');
        const newFeedbackRef = push(feedbackRef);

        await set(newFeedbackRef, {
          customerName: customerName,
          ticketId: ticketId,
          agentName: agentName,
          rating: parseInt(rating),
          mainIssue: mainIssue,
          suggestion: suggestion,
          timestamp: new Date().toISOString()
        });

        // تحويل للشاشة النهائية
        document.getElementById('feedbackForm').classList.add('hidden');
        document.getElementById('successState').classList.remove('hidden');
      } catch (error) {
        console.error("خطأ في حفظ البيانات:", error);
        alert("حدث خطأ أثناء إرسال التقييم، يرجى المحاولة مرة أخرى.");
        submitBtn.disabled = false;
        submitBtn.innerText = "إرسال التقييم";
      }
    };
  </script>

  <style>
    .star-rating {
      display: flex;
      flex-direction: row-reverse;
      justify-content: center;
      gap: 10px;
    }
    .star-rating input { display: none; }
    .star-rating label {
      font-size: 2.8rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: color 0.2s ease-in-out;
    }
    .star-rating input:checked ~ label,
    .star-rating label:hover,
    .star-rating label:hover ~ label {
      color: #f59e0b;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 w-full max-w-lg border border-slate-200">
    
    <!-- رأس الصفحة -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-blue-100 text-blue-600 rounded-full mb-3 text-2xl">
        🌐
      </div>
      <h1 id="customerWelcome" class="text-2xl font-bold text-slate-800">تقييم خدمة الدعم الفني</h1>
      <p class="text-sm text-slate-500 mt-1">رأيك يهمنا جداً لتطوير وتحسين جودة الخدمة</p>
      <span id="ticketDisplay" class="inline-block mt-2 text-xs font-semibold bg-slate-100 text-slate-600 px-3 py-1 rounded-full"></span>
    </div>

    <!-- فورم التقييم -->
    <form id="feedbackForm" onsubmit="event.preventDefault(); submitFeedback();" class="space-y-6">
      
      <!-- النجوم -->
      <div>
        <label class="block text-center text-sm font-medium text-slate-700 mb-2">ما هو تقييمك لمستوى الخدمة اليوم؟</label>
        <div class="star-rating">
          <input type="radio" id="star5" name="rating" value="5" /><label for="star5">★</label>
          <input type="radio" id="star4" name="rating" value="4" /><label for="star4">★</label>
          <input type="radio" id="star3" name="rating" value="3" /><label for="star3">★</label>
          <input type="radio" id="star2" name="rating" value="2" /><label for="star2">★</label>
          <input type="radio" id="star1" name="rating" value="1" /><label for="star1">★</label>
        </div>
      </div>

      <!-- اختيار أهم مشكلة -->
      <div>
        <label for="mainIssue" class="block text-sm font-medium text-slate-700 mb-2">أبرز مشكلة واجهتك (إن وجدت):</label>
        <select id="mainIssue" class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="لا توجد مشكلة">لم تواجهني أي مشكلة (ممتاز)</option>
          <option value="بطء الإنترنت">بطء في سرعة الإنترنت</option>
          <option value="انقطاع الخدمة">انقطاع متكرر للخدمة</option>
          <option value="إعدادات الراوتر">مشكلة في إعدادات الراوتر/الواي فاي</option>
          <option value="تأخر الدعم الفني">تأخر في الرد أو المتابعة</option>
          <option value="أخرى">مشكلة أخرى</option>
        </select>
      </div>

      <!-- مربع الاقتراحات -->
      <div>
        <label for="suggestion" class="block text-sm font-medium text-slate-700 mb-2">اقتراحك لتطوير الخدمة أو حل المشكلة:</label>
        <textarea id="suggestion" rows="3" placeholder="اكتب ملاحظاتك واقتراحاتك هنا بحرية..." class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
      </div>

      <!-- زر الإرسال -->
      <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition duration-200">
        إرسال التقييم
      </button>

    </form>

    <!-- رسالة النجاح -->
    <div id="successState" class="hidden text-center py-8">
      <div class="text-5xl mb-4">🎉</div>
      <h2 class="text-xl font-bold text-slate-800 mb-2">شكراً لتقييمك ووقتك!</h2>
      <p class="text-sm text-slate-600">ملاحظاتك وصلت للإدارة وستساعدنا في تقديم خدمة أفضل دائماً.</p>
    </div>

  </div>

</body>
</html>
